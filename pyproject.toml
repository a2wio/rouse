# Packaging exists for one line of the install — `pip install …` and
# then `rouse` on the path — and for nothing else. No dependencies, and
# there never will be any: the claim this repo makes is that the whole
# of it is stdlib python, and a requirements list is the first thing
# that stops being true.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# the install is `pip install git+…`, and this name is only ever seen
# there. `rouse` on PyPI is a polymer-dynamics package, so a published
# distribution would have to be called something else — decide that when
# there is a reason to publish, not now
name = "rouse"
description = "Memory with a clock — it comes and finds the agent"
readme = "README.md"
# `str | None` in annotations, and the walrus everywhere
requires-python = ">=3.10"
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/a2wio/rouse"

[project.scripts]
rouse = "rouse.cli:main"

[tool.setuptools]
packages = ["rouse", "rouse.core", "rouse.addons", "rouse.cli", "rouse.tests"]

[tool.setuptools.dynamic]
version = { attr = "rouse.__version__" }

# the skeleton is data, not code, and it has to be in the wheel: `rouse
# init` with nothing to copy is the install working right up until the
# first command
[tool.setuptools.package-data]
rouse = ["skeleton/**/*"]
