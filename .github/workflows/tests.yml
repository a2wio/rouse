name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -t .
      # the skeleton has to survive its own linter
      - run: python3 -m rouse init ./scratch && python3 -m rouse --memory ./scratch/memory check
